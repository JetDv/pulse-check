name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Keep APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: obd-gauges-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish APK to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk obd-gauges.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest obd-gauges.apk --target "${{ github.sha }}" --title "Latest build" --notes "Built from ${{ github.sha }}"
